[package]     # Groups package settings
name = "dairyfile"     # Names this backend
version = "1.0.0-a"     # Records current app version
edition = "2024"     # Selects Rust language rules
[lib]     # Groups shared backend settings
path = "lib.rs"     # Uses root-level library file
[[bin]]     # Groups executable settings
name = "dairyfile"     # Names backend executable
path = "main.rs"     # Uses later executable entry point
[dependencies]     # Lists required Rust packages
rusqlite = { version = "=0.41.1", features = ["bundled"] }      # Adds SQLite
serde = { version = "=1.0.229", features = ["derive"] }         # Adds automatic structured-data conversion
serde_json = "=1.0.154"                                         # Adds JSON request handling
zip = { version = "=9.1.3", default-features = false }          # Adds stored office documents
base64 = "=0.23.1"      # Carries generated bytes safely through JSON
[target.'cfg(windows)'.dependencies]     # Loads these packages only on Windows
windows-service = "=0.8.1"     # Connects backend to Windows services
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation"] }     # Provides built-in Windows operations
